<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conway's Game of Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-left">
        <span class="logo">LIFE</span>
        <span class="logo-sub">Conway's Game of Life</span>
      </div>
      <div class="topbar-center">
        <div class="stat-pill">
          <span class="stat-label">GEN</span>
          <span class="stat-value" id="generationCount">0</span>
        </div>
        <div class="stat-pill">
          <span class="stat-label">POP</span>
          <span class="stat-value" id="populationCount">0</span>
        </div>
        <div class="stat-pill">
          <span class="stat-label">FPS</span>
          <span class="stat-value" id="fpsDisplay">0</span>
        </div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="helpBtn" title="Help">?</button>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
      </div>
    </div>

    <!-- Left Sidebar -->
    <div class="sidebar left-sidebar" id="leftSidebar">
      <div class="sidebar-section">
        <div class="section-label">SIMULATION</div>
        <div class="control-row">
          <button class="ctrl-btn primary" id="playBtn">▶ Play</button>
          <button class="ctrl-btn" id="pauseBtn">⏸ Pause</button>
        </div>
        <div class="control-row">
          <button class="ctrl-btn" id="stepBtn">⏭ Step</button>
          <button class="ctrl-btn danger" id="resetBtn">✕ Clear</button>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="section-label">SPEED</div>
        <div class="slider-row">
          <span class="slider-min">1</span>
          <input
            type="range"
            id="fpsSlider"
            min="1"
            max="60"
            value="10"
            class="slider"
          />
          <span class="slider-max">60</span>
        </div>
        <div class="slider-value-row"><span id="fpsValue">10</span> fps</div>
      </div>
      <div class="sidebar-section">
        <div class="section-label">ZOOM</div>
        <div class="slider-row">
          <span class="slider-min">−</span>
          <input
            type="range"
            id="zoomSlider"
            min="1"
            max="60"
            value="10"
            class="slider"
          />
          <span class="slider-max">+</span>
        </div>
        <div class="slider-value-row">
          <span id="zoomValue">10</span> px/cell
        </div>
        <button class="ctrl-btn full-width" id="fitBtn">Fit to Screen</button>
      </div>
      <div class="sidebar-section">
        <div class="section-label">POPULATE</div>
        <button class="ctrl-btn full-width" id="randomBtn">Randomize</button>
        <div class="slider-row" style="margin-top: 8px">
          <span class="slider-min">0%</span>
          <input
            type="range"
            id="densitySlider"
            min="5"
            max="70"
            value="30"
            class="slider"
          />
          <span class="slider-max">70%</span>
        </div>
        <div class="slider-value-row">
          Density: <span id="densityValue">30</span>%
        </div>
      </div>
      <div class="sidebar-section">
        <div class="section-label">DRAW MODE</div>
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="draw">✏ Draw</button>
          <button class="mode-btn" data-mode="pan">✋ Pan</button>
          <button class="mode-btn" data-mode="erase">⌫ Erase</button>
        </div>
      </div>
    </div>

    <!-- Right Sidebar -->
    <div class="sidebar right-sidebar" id="rightSidebar">
      <div class="sidebar-section">
        <div class="section-label">PATTERNS</div>
        <input
          type="text"
          id="patternSearch"
          class="search-input"
          placeholder="Search patterns..."
        />
      </div>
      <div class="pattern-categories" id="patternCategories"></div>
      <div
        class="sidebar-section"
        style="
          margin-top: auto;
          padding-top: 16px;
          border-top: 1px solid var(--border);
        "
      >
        <div class="section-label">IMPORT RLE</div>
        <textarea
          id="rleArea"
          class="rle-textarea"
          placeholder="Paste RLE pattern here..."
        ></textarea>
        <button class="ctrl-btn primary full-width" id="loadRLEBtn">
          Load Pattern
        </button>
      </div>
    </div>

    <!-- Bottom bar -->
    <div class="bottombar">
      <span id="coordDisplay">x: 0, y: 0</span>
      <span class="bottombar-sep">|</span>
      <span id="zoomDisplay">zoom: 10px</span>
      <span class="bottombar-sep">|</span>
      <span>Scroll to zoom · Drag to pan · Click to draw</span>
    </div>

    <script src="script.js"></script>
  </body>
</html>
